# Builds, tests and lints the app on every push to dev and every pull request.
#
# Two jobs, deliberately split by cost:
#
#   build    ~6 min, runs always. Compile, JVM unit tests, lint.
#   emulator ~15 min, runs always but is allowed to be the slow one. Drives the
#            instrumented suite against a real Android emulator AND the Firebase
#            Auth/Firestore emulators, loading firestore.rules from the commit
#            being tested. This is the job that matters most: every rules bug
#            found in this project so far was found by these tests, and until
#            now they only ever ran on one laptop when someone remembered.
#
# PREREQUISITE, or every job fails at configuration time:
#   app/build.gradle.kts must guard signingConfigs behind
#   keystorePropertiesFile.exists(). Without it the unsafe `as String` cast on a
#   missing keystore.properties throws while the android block configures, and
#   assembleDebug dies even though it needs no signing.
#
# ONE SECRET, both jobs:
#   GOOGLE_SERVICES_JSON  base64 of app/google-services.json, which is
#                         gitignored so a clean runner has no copy. Produce it
#                         in PowerShell with:
#     [Convert]::ToBase64String([IO.File]::ReadAllBytes("app\google-services.json")) | Set-Clipboard
#
#   No signing secret is needed. CI never builds a release artifact; the AAB is
#   still produced locally, from the keystore that never leaves your machine.

name: Android CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - "web/**"
      - "legal/**"
      - "**/*.md"
  # Base-branch filtered. A fork's pull request still runs its own
  # build.gradle.kts on our runner, which is inherent to `pull_request` and is
  # why GOOGLE_SERVICES_JSON is withheld by GitHub for fork PRs and both jobs
  # fail closed without it. Keep "Require approval for all outside
  # collaborators" on in Settings > Actions; that, not this filter, is the
  # control that matters.
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A burst of pushes should leave one run standing, not six.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set. See the header of this file."
            exit 1
          fi
          echo "$GSJ" | base64 -d > app/google-services.json
          # Fail here with a clear message rather than inside AGP's parser.
          python3 -c "import json; json.load(open('app/google-services.json'))" \
            || { echo "::error::Decoded google-services.json is not valid JSON."; exit 1; }

      - name: Assemble debug and run unit tests
        run: ./gradlew assembleDebug test

      - name: Lint
        run: ./gradlew lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          retention-days: 30

  emulator:
    name: Instrumented tests (Firestore rules)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set."
            exit 1
          fi
          echo "$GSJ" | base64 -d > app/google-services.json

      # Pinned, and pinned to this version specifically. firebase-tools 14+
      # refuses to start the Firestore emulator on any JDK before 21, while the
      # Gradle build runs on 17. 13.15.2 is the version this project's emulator
      # suite is actually developed against locally, on JDK 17, so pinning keeps
      # CI and local identical instead of running two different toolchains.
      # Raise it only together with the JDK, and only after a green run.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.15.2

      # KVM makes the emulator usable rather than glacial on GitHub runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # firebase emulators:exec starts auth + firestore, runs the command, then
      # shuts them down and returns the command's exit code. It reads ports and
      # the rules path from firebase.json, so this stays in step with local runs
      # instead of duplicating the configuration.
      - name: Instrumented tests on API 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore --project pamoja-android-1ac6d "./gradlew connectedDebugAndroidTest"

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 30
