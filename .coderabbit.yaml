# CodeRabbit configuration for Pamoja
# https://docs.coderabbit.ai/guides/configure-coderabbit
#
# auto_review was disabled while the redesign was mid-flight, so that findings
# would not pile up against screens about to be replaced. The redesign shipped,
# so it is on as of 2026-08-25.
#
# ARMED, NOT ACTIVE. CodeRabbit only reviews pull requests, and this repository
# has had zero across 141 commits: everything lands straight on dev. So this
# flag currently changes nothing. It is set now so the first pull request, if
# one is ever opened, is reviewed rather than quietly missed.
#
# The unconditional safety net is .github/workflows/android-ci.yml, which runs
# on every push to dev with no pull request required. That covers compilation,
# 28 unit tests, 63 instrumented tests and lint. What it cannot cover is the
# judgement in path_instructions below, which is what this file is really for.

language: en-GB

reviews:
  # Terse over chatty. This project already documents intent in comments and
  # commit messages, so a review that restates what the code does is noise.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - dev

  path_filters:
    # Generated, vendored, or not source.
    - "!**/build/**"
    - "!graphify-out/**"
    - "!design/**"
    - "!**/*.jks"
    - "!**/google-services.json"

  path_instructions:
    - path: "app/src/main/java/com/pamoja/app/domain/**"
      instructions: >
        This layer must stay pure Kotlin. Flag any Android or Firebase import,
        including fully qualified references such as android.util.Patterns.
        User-facing text does not belong here either: validation failures carry
        a ValidationField and the UI supplies the wording.

    - path: "app/src/main/java/com/pamoja/app/data/**"
      instructions: >
        Firebase exceptions must be mapped to AppError at this boundary via
        toFirebaseAppError. Nothing above this layer should ever see a
        FirebaseFirestoreException. Flag any user-facing English string.
        Flag runCatching around suspend work, which swallows
        CancellationException; authCatching is the correct helper.

    - path: "app/src/main/java/com/pamoja/app/ui/**"
      instructions: >
        Colours come from LocalPamojaColors, never MaterialTheme.colorScheme or
        raw hex. Icons come from PamojaIcons; emoji are banned as icons, labels
        or list markers. Every user-facing string must be a stringResource, not
        a literal. Never render exception.message; use toErrorCopy or
        toSnackbarMessage. Flag LocalContext.current cast to Activity, which
        throws on a wrapped context; LocalActivity is correct.

    - path: "**/*ViewModel.kt"
      instructions: >
        ViewModels must not hold user-facing copy or a Context. Errors are
        AppError; a ViewModel's own messages are string resource ids as Int.
        Flag any error classification that matches on message text rather than
        on exception type.

    - path: "firestore.rules"
      instructions: >
        Check every rule against the client code that has to satisfy it. Flag
        any rule permitting list on users or groups, and any group update case
        that does not bound memberCount against maxMemberCap.

chat:
  auto_reply: true
