<!doctype html>
<!--
  Pamoja, invite link landing page
  Route: https://www.arkayenlabs.com/pamoja/join/[code]

  SECURITY: this page is DELIBERATELY "dumb". It must NEVER fetch or display
  any group information, not the group name, not the member count, not who
  is in it. Anyone on the internet can open this URL without authenticating,
  so anything rendered here is public. All group details are resolved inside
  the app, after the user is authenticated.

  It is also marked noindex so invite URLs never appear in search results.

  This page is mostly seen by people who do NOT have the app installed. If
  the app is installed and App Links are verified, Android opens the app
  directly and this page is never rendered. In-app browsers (Instagram and
  similar) ignore App Links, so the page can also be shown with the app
  installed; the main button handles both cases on Android.

  Carrying the invite through an install (2026-09-28): on Android the button
  is an intent:// link. With the app installed it opens pamoja://join/[code];
  without it, the browser falls back to the Play listing with the code in the
  install referrer, which the app reads on first launch
  (InstallReferrerReader). Before this, the code was dropped at Play and a
  new user landed on the Start screen with no group.

  Only the code from this page's own URL goes into those links, and only if
  it has the shape of a group ID. Nothing is fetched.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>You've been invited to a Pamoja group</title>
  <style>
    /* Lilac, the app's palette since the 2026 rebuild (REBUILD_PLAN.md §5). */
    :root {
      --bg: #f6f4fb;
      --card: #ffffff;
      --text: #16132b;
      --muted: #5a5670;
      --mark: #cfc6ff;
      --on-mark: #16132b;
      --button: #16132b;
      --on-button: #ffffff;
      --border: #e7e3f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121026;
        --card: #1d1a36;
        --text: #f4f2ff;
        --muted: #b4aed3;
        --mark: #2b2555;
        --on-mark: #f4f2ff;
        --button: #cfc6ff;
        --on-button: #16132b;
        --border: #2c2848;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: var(--mark);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark svg { width: 32px; height: 32px; stroke: var(--on-mark); }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 12px; font-weight: 800; }
    p { font-size: 16px; line-height: 1.55; color: var(--muted); margin: 0 0 28px; }
    .btn {
      display: inline-block;
      background: var(--button);
      color: var(--on-button);
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 15px 32px;
      border-radius: 999px;
      transition: opacity .2s ease;
    }
    .btn:hover { opacity: .9; }
    .hint { font-size: 13px; color: var(--muted); margin: 20px 0 0; }
    .hint a { color: var(--muted); }
    .ios { display: none; }
    .brand { font-size: 12px; color: var(--muted); margin-top: 28px; }
    .brand a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
        <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
        <path d="M16 17h4"/><path d="M4 13h4"/>
      </svg>
    </div>

    <h1>You've been invited to a Pamoja group</h1>
    <p>Pamoja is one weekly step goal you share with your group. Get the app to see your invite.</p>

    <a class="btn" id="open" href="https://play.google.com/store/apps/details?id=com.arkayenlabs.pamoja">
      Open the invite
    </a>

    <p class="hint">Button not working? <a id="play" href="https://play.google.com/store/apps/details?id=com.arkayenlabs.pamoja">Get Pamoja on Google Play</a>, then open this link again.</p>
    <p class="hint ios" id="ios">Pamoja is on Android for now.</p>

    <p class="brand">
      An <a href="https://www.arkayenlabs.com">Arkayen Labs</a> product ·
      <a href="https://www.arkayenlabs.com/privacy/pamoja">Privacy</a> ·
      <a href="https://www.arkayenlabs.com/terms/pamoja">Terms</a>
    </p>
  </main>
  <script>
    (function () {
      var PACKAGE = "com.arkayenlabs.pamoja";
      // A group ID, and nothing else, from this page's own path.
      var match = location.pathname.match(/\/pamoja\/join\/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\/?$/);
      var code = match ? match[1] : null;
      var referrer = "utm_source=invite_link" + (code ? "&invite=" + code : "");
      var play = "https://play.google.com/store/apps/details?id=" + PACKAGE +
        "&referrer=" + encodeURIComponent(referrer);
      var ua = navigator.userAgent || "";
      var open = document.getElementById("open");
      document.getElementById("play").href = play;
      if (/android/i.test(ua) && code) {
        // The app if it is installed; Play, carrying the code, if it is not.
        open.href = "intent://join/" + code + "#Intent;scheme=pamoja;package=" + PACKAGE +
          ";S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
      } else {
        open.href = play;
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        document.getElementById("ios").style.display = "block";
      }
    })();
  </script>
</body>
</html>
